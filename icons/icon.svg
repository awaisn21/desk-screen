<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0b0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e07b20"/>
    </linearGradient>
    <clipPath id="bounds">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0e0d14"/>

  <!-- All clipped inside rounded rect -->
  <g clip-path="url(#bounds)">

    <!-- Ambient glow behind sun -->
    <ellipse cx="256" cy="295" rx="200" ry="150" fill="url(#sunGlow)"/>

    <!-- Horizontal scan lines (retro texture) -->
    <g opacity="0.07" stroke="#f5a623" stroke-width="1.2">
      <line x1="0" y1="210" x2="512" y2="210"/>
      <line x1="0" y1="222" x2="512" y2="222"/>
      <line x1="0" y1="234" x2="512" y2="234"/>
      <line x1="0" y1="246" x2="512" y2="246"/>
      <line x1="0" y1="258" x2="512" y2="258"/>
      <line x1="0" y1="270" x2="512" y2="270"/>
      <line x1="0" y1="282" x2="512" y2="282"/>
      <line x1="0" y1="294" x2="512" y2="294"/>
    </g>

    <!-- Sun (clipped at horizon) -->
    <clipPath id="sunClip">
      <rect x="0" y="0" width="512" height="295"/>
    </clipPath>
    <circle cx="256" cy="295" r="82" fill="url(#sunGrad)" clip-path="url(#sunClip)"/>

    <!-- Concentric rings around sun -->
    <circle cx="256" cy="295" r="106" fill="none" stroke="#f5a623" stroke-width="1.2" opacity="0.25"/>
    <circle cx="256" cy="295" r="130" fill="none" stroke="#f5a623" stroke-width="1.0" opacity="0.15"/>
    <circle cx="256" cy="295" r="154" fill="none" stroke="#f5a623" stroke-width="0.8" opacity="0.10"/>

    <!-- Horizon line -->
    <line x1="0" y1="295" x2="512" y2="295" stroke="#f5a623" stroke-width="1" opacity="0.3"/>

    <!-- Mountain range — back layer -->
    <polygon points="0,380 80,260 160,320 240,230 320,300 400,240 512,320 512,420 0,420"
             fill="#1c1a2e" opacity="0.9"/>

    <!-- Mountain range — front layer -->
    <polygon points="0,420 60,340 130,390 200,310 270,370 340,295 420,360 480,320 512,360 512,512 0,512"
             fill="#13111f"/>

  </g>
</svg>
