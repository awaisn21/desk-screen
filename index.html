<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Desk Screen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage"></div>

<button class="background" id="background" type="button" aria-label="Change background">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <circle cx="8.5" cy="9.75" r="1.25" fill="currentColor" stroke="none"/>
    <path d="M3.6 16.4l4.3-4.1a1.6 1.6 0 0 1 2.2 0l3 2.9"/>
    <path d="M14 15.4l1.9-1.8a1.6 1.6 0 0 1 2.2 0l2.3 2.2"/>
  </svg>
</button>

<div class="player" id="player" data-state="notice">
  <div class="controls">
    <button class="skip" id="prev" type="button" aria-label="Previous track">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M6 4.5h2.2v15H6z"/>
        <path d="M20 5.6v12.8a.9.9 0 0 1-1.38.76l-9.9-6.4a.9.9 0 0 1 0-1.52l9.9-6.4A.9.9 0 0 1 20 5.6z"/>
      </svg>
    </button>

    <div class="play-slot">
      <svg class="ring" viewBox="0 0 46 46" aria-hidden="true">
        <circle class="track" cx="23" cy="23" r="21.25"/>
        <circle class="fill" id="ring" cx="23" cy="23" r="21.25"
                stroke-dasharray="133.5" stroke-dashoffset="133.5"/>
      </svg>
      <button id="play" type="button" data-state="paused" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path id="play-icon" d="M7 4.6v14.8a.9.9 0 0 0 1.38.76l11.4-7.4a.9.9 0 0 0 0-1.52L8.38 3.84A.9.9 0 0 0 7 4.6z"/>
        </svg>
      </button>
    </div>

    <button class="skip" id="next" type="button" aria-label="Next track">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M4 5.6v12.8a.9.9 0 0 0 1.38.76l9.9-6.4a.9.9 0 0 0 0-1.52l-9.9-6.4A.9.9 0 0 0 4 5.6z"/>
        <path d="M15.8 4.5H18v15h-2.2z"/>
      </svg>
    </button>
  </div>

  <div class="divider"></div>

  <div class="meta">
    <div class="title" id="title">Starting up</div>
    <div class="artist" id="artist">One moment</div>
  </div>
</div>

<script src="config.js"></script>
<script src="backgrounds.js"></script>
<script src="tracks.js"></script>
<script src="engine-spotify.js"></script>
<script src="engine-files.js"></script>
<script src="engine-ambient.js"></script>
<script src="app.js"></script>
</body>
</html>
